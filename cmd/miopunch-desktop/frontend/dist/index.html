<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>miopunch</title>
    <link rel="stylesheet" href="/assets/md3.css" />
    <link rel="stylesheet" href="/assets/vendor/xterm/xterm.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="app-nav" aria-label="Primary navigation">
        <div class="app-mark" aria-hidden="true">m</div>
        <nav class="nav-tabs">
          <button class="nav-tab is-active" data-tab="network" aria-current="page" title="Network">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z" />
              <path d="M5 18a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" />
              <path d="M19 18a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" />
              <path d="M9.4 10.4 7.6 12.6" />
              <path d="m14.6 10.4 1.8 2.2" />
            </svg>
            <span>Network</span>
          </button>
          <button class="nav-tab" data-tab="shell" data-shell-nav title="Shell">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 5h16v14H4z" />
              <path d="m7 9 3 3-3 3" />
              <path d="M12 15h5" />
            </svg>
            <span>Shell</span>
          </button>
          <button class="nav-tab" data-tab="admin" data-admin-nav title="Admin">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3 5 6v5c0 4.4 3 8.3 7 9.5 4-1.2 7-5.1 7-9.5V6l-7-3Z" />
              <path d="m9 12 2 2 4-5" />
            </svg>
            <span>Admin</span>
          </button>
          <button class="nav-tab" data-tab="settings" title="Settings">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Z" />
              <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 0 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1A2 2 0 0 1 4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.3 7A2 2 0 1 1 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3h.1a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6h.1a1.7 1.7 0 0 0 1.9-.3l.1-.1A2 2 0 1 1 19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.6 1h.1a2 2 0 0 1 0 4H21a1.7 1.7 0 0 0-1.6 1Z" />
            </svg>
            <span>Settings</span>
          </button>
        </nav>
      </aside>

      <section class="app-main">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="topbar-eyebrow">device network</p>
            <h1 id="topbar-title">Network</h1>
          </div>
          <div class="topbar-actions">
            <label class="preview-select" id="preview-fixture-wrap" for="preview-fixture">
              <span>Preview</span>
              <select id="preview-fixture">
                <option value="owner">Owner</option>
                <option value="member">Member</option>
                <option value="empty">No network</option>
                <option value="disconnected">Disconnected</option>
              </select>
            </label>
            <button class="btn btn-primary" id="btn-refresh">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 12a8 8 0 1 1-2.35-5.65" />
                <path d="M20 4v6h-6" />
              </svg>
              <span>Refresh</span>
            </button>
          </div>
        </header>

        <section class="page-host" id="page-host" aria-live="polite"></section>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <noscript>
      <div class="noscript">This panel requires JavaScript.</div>
    </noscript>

    <script defer src="/assets/vendor/xterm/xterm.js"></script>
    <script defer src="/assets/vendor/qrcode/qrcode.js"></script>
    <script defer src="/assets/app.js"></script>
  </body>
</html>
