[package]
name = "miopunch-native-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[lib]
crate-type = ["rlib"]

[workspace]
resolver = "2"
members = ["browser-probe", "vendor/p2panda-auth", "vendor/p2panda-net"]
exclude = ["vendor/iroh", "vendor/noq", "vendor/noq-proto", "vendor/netwatch", "vendor/portmapper"]

[workspace.lints.clippy]
unused_async = "warn"
needless_pass_by_ref_mut = "warn"

[features]
nat-lab-test-hooks = ["iroh/miopunch-test-hooks"]
replica-test-hooks = []
member-signaling-test-hooks = []
rtc-probe = ["dep:webrtc", "dep:async-trait", "dep:bytes"]

[workspace.dependencies]
blake3 = "1.8.5"
futures-channel = "0.3.32"
futures-test = "0.3.32"
futures-util = { version = "0.3.32", default-features = false }
hex = "0.4.3"
rsasl = { version = "=2.3.1", default-features = false, features = ["config_builder", "provider", "scram-sha-2"] }
sha2 = "0.10.9"
mock_instant = "0.6.1"
pin-project = "1.1.13"
petgraph = "0.8.3"
rand = "0.10.1"
rand_chacha = "0.10.0"
serde = "1.0.228"
serde_bytes = "0.11.19"
test-log = "0.2.21"
thiserror = "2.0.18"
tokio = { version = "1.52.3", default-features = false }
tokio-stream = { version = "0.1.18", default-features = false }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
p2panda-core = { version = "=0.7.1", default-features = false }
p2panda-auth = { version = "=0.7.1", default-features = false }
p2panda-discovery = { version = "=0.7.1", default-features = false }
p2panda-store = { version = "=0.7.1", default-features = false }
p2panda-sync = { version = "=0.7.1", default-features = false }

[dependencies]
blake3.workspace = true
iroh = { version = "=1.2.0", default-features = false, features = ["tls-ring", "unstable-custom-transports", "portmapper"] }
iroh-base = { version = "=1.2.0", features = ["key"] }
n0-watcher = "1.0.0"
n0-future = "0.3.2"
noq-proto = "=1.3.0"
noq-udp = "=1.3.0"
futures-channel = "0.3.32"
futures-util = { version = "0.3.32", features = ["sink"] }
portmapper = "=0.19.3"
netwatch = "=0.19.3"
p2panda-core = "=0.7.1"
p2panda-auth = { workspace = true, features = ["serde"] }
p2panda-store.workspace = true
p2panda-sync.workspace = true
tokio-util = { version = "0.7.18", features = ["codec"] }
p2panda-net = { path = "vendor/p2panda-net", default-features = false, features = ["iroh_endpoint", "discovery"] }
p2panda-discovery.workspace = true
rand_chacha.workspace = true
rsasl.workspace = true
sha2.workspace = true
rumqttc = { version = "=0.25.1", default-features = false, features = ["use-rustls-no-provider"] }
rand = "0.10.1"
rustix = { version = "1.1.5", features = ["fs"] }
hex = "0.4.3"
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.151"
socket2 = "0.6.5"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror.workspace = true
tokio = { version = "1.52.3", features = ["full"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.21.1"

[dev-dependencies]
bytes = "1.11.1"
rustix = { version = "1.1.5", features = ["process"] }
iroh = { version = "=1.2.0", default-features = false, features = ["tls-ring", "unstable-custom-transports", "miopunch-test-hooks", "metrics"] }
tempfile = "3.22.0"
iroh-relay = { version = "=1.2.0", features = ["server", "test-utils"] }

[[bin]]
name = "browser-probe-native"
path = "src/bin/browser_probe_native.rs"

[[bin]]
name = "browser_wss_member_native"
path = "src/bin/browser_wss_member_native.rs"
required-features = ["rtc-probe"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
webrtc = { version = "=0.21.0", default-features = false, features = ["runtime-tokio", "crypto-ring"], optional = true }
async-trait = { version = "0.1.89", optional = true }
bytes = { version = "1.12.0", optional = true }
iroh-mdns-address-lookup = "=0.5.0"
iroh-relay = { version = "=1.2.0", features = ["server"] }
rcgen = "0.14.8"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
rustls-pemfile = "2.2.0"
webpki-roots = "1.0.9"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
p2panda-net = { path = "vendor/p2panda-net", default-features = false, features = ["iroh_mdns"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[patch.crates-io]
iroh-relay = { path = "vendor/iroh-relay" }
p2panda-sync = { path = "vendor/p2panda-sync" }
iroh = { path = "vendor/iroh" }
noq = { path = "vendor/noq" }
noq-proto = { path = "vendor/noq-proto" }
p2panda-auth = { path = "vendor/p2panda-auth" }
netwatch = { path = "vendor/netwatch" }
portmapper = { path = "vendor/portmapper" }
