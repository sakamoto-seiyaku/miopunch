name: POC v1 CLI Smoke

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to test
        required: false
        type: string

permissions:
  contents: read

jobs:
  poc-v1-cli-smoke:
    name: poc-v1-cli-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      MIOPUNCH_POC_V1_CLI_SMOKE_BROKER_URL: ${{ secrets.MIOPUNCH_POC_V1_CLI_SMOKE_BROKER_URL }}
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Require broker secret
        shell: bash
        run: |
          test -n "${MIOPUNCH_POC_V1_CLI_SMOKE_BROKER_URL}" || {
            echo "missing secret: MIOPUNCH_POC_V1_CLI_SMOKE_BROKER_URL" >&2
            exit 1
          }

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install lab host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils openssh-client rsync curl

      - name: Cache Debian cloud image
        uses: actions/cache@v5
        with:
          path: lab/_images
          key: miopunch-lab-debian12-${{ runner.os }}-v1

      - name: Download lab image
        run: ./lab/host/labctl download

      - name: Run POC v1 CLI smoke
        run: ./lab/host/labctl poc-v1-cli-smoke

      - name: Stop lab VM
        if: always()
        run: ./lab/host/labctl down || true

      - name: Upload lab diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: poc-v1-cli-smoke
          if-no-files-found: warn
          path: |
            lab/_artifacts/**
            lab/_state/qemu.log
            lab/_state/serial.log
