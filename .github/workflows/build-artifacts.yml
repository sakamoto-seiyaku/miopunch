name: Build Artifacts

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
      version:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        type: string
      version:
        description: Release version to embed, for example v0.1.0-rc.1
        required: false
        type: string

permissions:
  contents: read

jobs:
  binary-bundles:
    name: Binary bundles
    runs-on: ubuntu-24.04
    env:
      MIOPUNCH_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Build binary bundles
        run: bash scripts/release/build_bundles.sh

      - name: Upload binary bundles
        uses: actions/upload-artifact@v7
        with:
          name: binary-bundles
          path: dist/release/*
          if-no-files-found: error

  linux-deb-webkit2-40:
    name: Linux .deb WebKitGTK 4.0
    runs-on: ubuntu-24.04
    env:
      MIOPUNCH_VERSION: ${{ inputs.version }}
      MIOPUNCH_DEB_OUT: ${{ github.workspace }}/dist/release
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Build Debian package
        run: bash packaging/linux/deb/build_deb_docker.sh --webkit2_40 --smoke-install

      - name: Upload Debian package
        uses: actions/upload-artifact@v7
        with:
          name: linux-deb-webkit2-40
          path: dist/release/*.deb
          if-no-files-found: error

  linux-deb-webkit2-41:
    name: Linux .deb WebKitGTK 4.1
    runs-on: ubuntu-24.04
    env:
      MIOPUNCH_VERSION: ${{ inputs.version }}
      MIOPUNCH_DEB_OUT: ${{ github.workspace }}/dist/release
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Build Debian package
        run: bash packaging/linux/deb/build_deb_docker.sh --webkit2_41 --smoke-install

      - name: Upload Debian package
        uses: actions/upload-artifact@v7
        with:
          name: linux-deb-webkit2-41
          path: dist/release/*.deb
          if-no-files-found: error

  windows-installer:
    name: Windows NSIS installer
    runs-on: ubuntu-24.04
    env:
      MIOPUNCH_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis

      - name: Build Windows installer
        run: bash scripts/release/build_windows_installer.sh

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/release/*.exe
          if-no-files-found: error

  assemble:
    name: Assemble release assets
    runs-on: ubuntu-24.04
    needs:
      - binary-bundles
      - linux-deb-webkit2-40
      - linux-deb-webkit2-41
      - windows-installer
    env:
      MIOPUNCH_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          path: dist/release
          merge-multiple: true

      - name: Generate checksums and manifest
        run: bash scripts/release/generate_manifest.sh dist/release

      - name: Upload assembled release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/release/*
          if-no-files-found: error
