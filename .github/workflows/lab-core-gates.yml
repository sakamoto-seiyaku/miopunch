name: Lab Core Gates

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to test
        required: false
        type: string

permissions:
  contents: read

jobs:
  core-lab:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: selftest
            command: ./lab/host/labctl selftest
          - name: xtcp-selftest
            command: ./lab/host/labctl xtcp-selftest
          - name: xtcp-connectivity-selftest
            command: ./lab/host/labctl xtcp-connectivity-selftest
          - name: xtcp-fulltest
            command: ./lab/host/labctl xtcp-fulltest
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install lab host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils openssh-client rsync curl

      - name: Cache Debian cloud image
        uses: actions/cache@v5
        with:
          path: lab/_images
          key: miopunch-lab-debian12-${{ runner.os }}-v1

      - name: Download lab image
        run: ./lab/host/labctl download

      - name: Run lab gate
        run: ${{ matrix.command }}

      - name: Stop lab VM
        if: always()
        run: ./lab/host/labctl down || true

      - name: Upload lab diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lab-core-${{ matrix.name }}
          if-no-files-found: warn
          path: |
            lab/_artifacts/**
            lab/_state/qemu.log
            lab/_state/serial.log
