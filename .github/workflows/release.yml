name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
      tag: ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Validate tag
        id: tag
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "unsupported release tag: ${tag}" >&2
            exit 1
          fi
          prerelease=false
          if [[ "${tag}" == *"-rc."* ]]; then
            prerelease=true
          fi
          {
            echo "tag=${tag}"
            echo "ref=refs/tags/${tag}"
            echo "prerelease=${prerelease}"
          } >>"${GITHUB_OUTPUT}"

  go-checks:
    name: Go checks
    needs: validate-tag
    uses: ./.github/workflows/go-checks.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.validate-tag.outputs.ref }}

  build-artifacts:
    name: Build artifacts
    needs: validate-tag
    uses: ./.github/workflows/build-artifacts.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.validate-tag.outputs.ref }}
      version: ${{ needs.validate-tag.outputs.tag }}

  lab-core-gates:
    name: Lab core gates
    needs: validate-tag
    uses: ./.github/workflows/lab-core-gates.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.validate-tag.outputs.ref }}

  lab-scenarios:
    name: Lab scenario gates
    needs: validate-tag
    uses: ./.github/workflows/lab-scenarios.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.validate-tag.outputs.ref }}

  publish:
    name: Publish GitHub Release
    needs:
      - validate-tag
      - go-checks
      - build-artifacts
      - lab-core-gates
      - lab-scenarios
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      MIOPUNCH_VERSION: ${{ needs.validate-tag.outputs.tag }}
    steps:
      - name: Check out tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-tag.outputs.ref }}
          submodules: recursive

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist/release

      - name: Verify checksums and manifest
        run: |
          test -s dist/release/checksums.txt
          test -s dist/release/release-manifest.json
          (cd dist/release && sha256sum -c checksums.txt)

      - name: Attest release assets
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/release/*

      - name: Publish release
        shell: bash
        run: |
          args=(--verify-tag --latest=false --generate-notes)
          if [[ "${{ needs.validate-tag.outputs.prerelease }}" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${MIOPUNCH_VERSION}" dist/release/* "${args[@]}"
