[package]
name = "miopunch-native-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
autobins = false

[features]
nat-lab-test-hooks = ["miopunch-native-probe/nat-lab-test-hooks"]
replica-test-hooks = ["miopunch-native-probe/replica-test-hooks"]
member-signaling-test-hooks = ["miopunch-native-probe/member-signaling-test-hooks"]
rtc-probe = ["miopunch-native-probe/rtc-probe"]

[dependencies]
miopunch-native-probe = { path = "../.." }
base64.workspace = true
blake3.workspace = true
hex.workspace = true
iroh.workspace = true
iroh-base.workspace = true
n0-future.workspace = true
n0-watcher.workspace = true
p2panda-auth = { workspace = true, features = ["serde"] }
p2panda-core = "=0.7.1"
rand.workspace = true
ring.workspace = true
rustix.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
socket2.workspace = true
tokio = { version = "1.52.3", features = ["full"] }
tokio-util.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iroh-relay.workspace = true
rcgen.workspace = true
rustls.workspace = true

[dev-dependencies]
rustix = { version = "1.1.5", features = ["process"] }
iroh = { version = "=1.2.0", default-features = false, features = ["tls-ring", "unstable-custom-transports", "miopunch-test-hooks", "metrics"] }
iroh-relay = { version = "=1.2.0", features = ["server", "test-utils"] }

[[bin]]
name = "browser-probe-native"
path = "../../src/bin/browser_probe_native.rs"
test = false
bench = false

[[bin]]
name = "browser_irc_datagram"
path = "../../src/bin/browser_irc_datagram.rs"
test = false
bench = false

[[bin]]
name = "browser_irc_restricted_native"
path = "../../src/bin/browser_irc_restricted_native.rs"
test = false
bench = false

[[bin]]
name = "browser_mqtt_datagram"
path = "../../src/bin/browser_mqtt_datagram.rs"
test = false
bench = false

[[bin]]
name = "browser_network_native"
path = "../../src/bin/browser_network_native.rs"
test = false
bench = false

[[bin]]
name = "browser_restricted_native"
