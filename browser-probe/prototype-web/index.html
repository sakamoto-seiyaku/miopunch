<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>miopunch · 网页访问原型</title>
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f4f5f7; color: #202733; font: 16px system-ui, sans-serif; }
  header { padding: 20px 28px; background: white; border-bottom: 1px solid #dfe3e9; }
  h1 { margin: 0 0 6px; font-size: 22px; }
  p { margin: 8px 0; } .muted { color: #667080; font-size: 14px; }
  main { max-width: 1100px; margin: 24px auto; padding: 0 20px; }
  section { padding: 20px; background: white; border: 1px solid #dfe3e9; border-radius: 10px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  input { flex: 1; min-width: 200px; padding: 11px; border: 1px solid #b9c3d2; border-radius: 6px; font: inherit; }
  button { padding: 11px 18px; color: white; background: #245bba; border: 0; border-radius: 6px; font: inherit; cursor: pointer; }
  button:disabled { background: #8994a5; cursor: wait; }
  #status { margin: 14px 0; min-height: 24px; }
  #content { width: 100%; height: 480px; border: 1px solid #dfe3e9; border-radius: 6px; background: #fff; }
  #bridge { display: none; } #diagnostics { white-space: pre-wrap; word-break: break-all; font-size: 12px; }
</style>
<header><h1>miopunch</h1><div class="muted">网页访问 · 可运行原型</div></header>
<main><section>
  <div class="row"><strong>测试节点</strong><span id="peer" class="muted">准备中</span><button id="connect" disabled>连接节点</button></div>
  <p id="status">正在启动独立浏览器节点…</p>
  <form id="open-form" class="row"><input id="address" aria-label="内网地址" value="http://node-only.invalid/"><button id="open" disabled>打开网页</button></form>
  <p class="muted">本次验证使用仅由测试节点解析的 HTTP 站点。支持小页面、资源、导航与表单；WebSocket 和完整站点兼容仍待验证。</p>
  <iframe id="content" title="节点提供的网页" sandbox="allow-scripts allow-forms allow-same-origin"></iframe>
  <iframe id="bridge" title="原型通信"></iframe>
  <details><summary>验证状态</summary><pre id="diagnostics"></pre></details>
</section></main>
<script type="module">
import init, { BrowserNetwork } from '/pkg/miopunch_browser_probe.js';
const configuration = await (await fetch('/__config')).json();
const status = document.querySelector('#status');
const connect = document.querySelector('#connect');
const open = document.querySelector('#open');
const bridge = document.querySelector('#bridge');
const content = document.querySelector('#content');
const diagnostics = document.querySelector('#diagnostics');
let network, member, bridgeReady;
let requestCount = 0;
const report = () => {
  diagnostics.textContent = JSON.stringify({ browserId: network?.id(), providerId: configuration.peer,
    requests: requestCount, session: member ? JSON.parse(member.session_diagnostics()) : null }, null, 2);
};
// Diagnostic handles belong only to this trusted management origin.
window.prototype = { configuration, requestCount: () => requestCount, network: () => network, member: () => member };
window.ready = (async () => {
  await init();
  network = await BrowserNetwork.start(JSON.stringify({ relays: [configuration.relay], disabled: [] }));
  document.querySelector('#peer').textContent = configuration.peer.slice(0, 12);
  status.textContent = '节点已启动，点击连接测试节点。';
  connect.disabled = false;
  report();
})();
window.ready.catch(error => { status.textContent = String(error); });
async function prepareBridge() {
  bridgeReady = new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error('网页通道准备超时')), 15000);
    const listener = event => {
      if (event.source !== bridge.contentWindow || event.origin !== configuration.contentOrigin || event.data !== 'prototype-bridge-ready') return;
      window.removeEventListener('message', listener);
      const channel = new MessageChannel();
      channel.port1.onmessage = async message => {
        if (message.data.type === 'bridge-registered') { clearTimeout(timer); resolve(); return; }
        const { id, request } = message.data;
        try {
          const result = JSON.parse(await member.exchange(JSON.stringify(request)));
          requestCount += 1;
          report();
          channel.port1.postMessage({ id, result });
        } catch (error) {
          channel.port1.postMessage({ id, result: { error: String(error) } });
        }
      };
      bridge.contentWindow.postMessage('prototype-connect', configuration.contentOrigin, [channel.port2]);
    };
    window.addEventListener('message', listener);
  });
  bridge.src = `${configuration.contentOrigin}/__bridge.html?parent=${encodeURIComponent(location.origin)}`;
  await bridgeReady;
}
connect.onclick = async () => {
  connect.disabled = true;
  try {
    status.textContent = '正在加入并连接测试节点…';
    await network.request_precode(configuration.code);
    await network.complete_admission();
    member = await network.open_member_connection(configuration.peer);
    await prepareBridge();
    status.textContent = '已连接，可以打开该节点提供的网页。';
    open.disabled = false;
    report();
  } catch (error) {
    status.textContent = String(error);
    connect.disabled = false;
  }
};
document.querySelector('#open-form').onsubmit = event => {
  event.preventDefault();
  try {
    const address = new URL(document.querySelector('#address').value);
    if (address.origin !== 'http://node-only.invalid') throw new Error('此原型仅开放测试节点的 node-only.invalid 站点');
    content.src = configuration.contentOrigin + address.pathname + address.search + address.hash;
    status.textContent = `已连接 · ${address.href}`;
  } catch (error) { status.textContent = String(error); }
};
window.closePrototype = async () => { member?.close(); await network?.close(); };
</script>
</html>
