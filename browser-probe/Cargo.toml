[package]
name = "miopunch-browser-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
iroh = { version = "=1.2.0", default-features = false, features = ["tls-ring"] }
iroh-base = { version = "=1.2.0", features = ["key"] }
p2panda-core = { version = "=0.7.1", default-features = false }
p2panda-store = { version = "=0.7.1", default-features = false }
hex = "0.4.3"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.79", features = ["Window", "Storage"] }
