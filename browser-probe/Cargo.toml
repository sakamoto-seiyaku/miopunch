[package]
name = "miopunch-browser-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[features]
rtc-probe = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
iroh = { version = "=1.2.0", default-features = false, features = ["tls-ring", "unstable-custom-transports"] }
iroh-base = { version = "=1.2.0", features = ["key"] }
p2panda-core = { version = "=0.7.1", default-features = false }
p2panda-store = { version = "=0.7.1", default-features = false }
p2panda-auth = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.151"
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
rsasl.workspace = true
sha2.workspace = true
rand.workspace = true
n0-future = "0.3.2"
hex = "0.4.3"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
web-sys = { version = "0.3.79", features = ["Window", "Storage", "WebSocket", "BinaryType", "CloseEvent", "Event", "MessageEvent", "RtcPeerConnection", "RtcPeerConnectionState", "RtcConfiguration", "RtcDataChannel", "RtcDataChannelInit", "RtcDataChannelState", "RtcDataChannelType", "RtcSdpType", "RtcSessionDescription", "RtcSessionDescriptionInit", "RtcIceGatheringState", "RtcIceConnectionState", "RtcStatsReport"] }

p2panda-sync.workspace = true
futures-util = { version = "0.3.32", features = ["sink"] }
tokio-util = { version = "0.7.18", features = ["codec"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }

blake3 = "1"
n0-watcher = "1.0.0"
noq-udp = "=1.3.0"
send_wrapper = "0.6.0"
