[package]
name = "mio83-replica-red-selected"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false
autobins = false

[workspace]
resolver = "2"

[features]
rtc-probe = ["miopunch-native-probe/rtc-probe"]

[[test]]
name = "member_path_protocol"
path = "/home/js/Git/miopunch/tests/member_path_protocol.rs"

[[test]]
name = "unified_connection"
path = "/home/js/Git/miopunch/tests/unified_connection.rs"

[[test]]
name = "unified_admission_story"
path = "/home/js/Git/miopunch/tests/unified_admission_story.rs"

[[test]]
name = "negotiated_accept_context"
path = "/home/js/Git/miopunch/tests/negotiated_accept_context.rs"

[dependencies]
async-trait = { version = "=0.1.92" }
webrtc = { version = "=0.21.0", default-features = false, features = ["runtime-tokio", "crypto-ring"] }
futures-util = { version = "=0.3.34", features = ["sink"] }
blake3 = "=1.8.7"
rustix = { version = "=1.1.5", features = ["process"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = "=1.0.229"
hex = "=0.4.3"
n0-watcher = "=1.0.0"
iroh-relay = { version = "=1.2.0", features = ["server", "test-utils"] }
miopunch-native-probe = { path = "/home/js/Git/miopunch", default-features = false }
iroh = { version = "=1.2.0", default-features = false, features = ["tls-ring", "unstable-custom-transports", "miopunch-test-hooks", "metrics"] }
iroh-base = { version = "=1.2.0", features = ["key"] }
n0-future = "=0.3.2"
p2panda-core = "=0.7.1"
serde_json = "=1.0.151"
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["full"] }
tokio-util = { version = "=0.7.19", features = ["codec"] }

[patch.crates-io]
iroh-relay = { path = "/home/js/Git/miopunch/vendor/iroh-relay" }
p2panda-sync = { path = "/home/js/Git/miopunch/vendor/p2panda-sync" }
iroh = { path = "/home/js/Git/miopunch/vendor/iroh" }
noq = { path = "/home/js/Git/miopunch/vendor/noq" }
noq-proto = { path = "/home/js/Git/miopunch/vendor/noq-proto" }
p2panda-auth = { path = "/home/js/Git/miopunch/vendor/p2panda-auth" }
netwatch = { path = "/home/js/Git/miopunch/vendor/netwatch" }
portmapper = { path = "/home/js/Git/miopunch/vendor/portmapper" }

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false

[[test]]
name = "tcp_direct_member_preserved"
path = "/tmp/mio84-contract-build-root-20261008/selector/tcp_direct_member_preserved.rs"

[[bin]]
name = "irc_current_native"
path = "/tmp/mio89-confirmation-reviewed-sdk-v4-20261011/irc_current_native.rs"

[[test]]
name = "irc_datagram"
path = "/home/js/Git/miopunch/tests/irc_datagram.rs"

[[test]]
name = "legacy_multi_socket"
path = "/home/js/Git/miopunch/tests/legacy_multi_socket.rs"

[[test]]
name = "unified_path_selection"
path = "/home/js/Git/miopunch/tests/unified_path_selection.rs"

[[test]]
name = "rtc_association"
path = "/home/js/Git/miopunch/tests/rtc_association.rs"

[[test]]
name = "rtc_path_qualification"
path = "/home/js/Git/miopunch/tests/rtc_path_qualification.rs"

[[test]]
name = "rtc_invalidation_barrier"
path = "/home/js/Git/miopunch/tests/rtc_invalidation_barrier.rs"
