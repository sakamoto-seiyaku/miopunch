network:
  name: ErgoTest
server:
  name: ergo.test
  listeners:
    :6667: {}
  unix-bind-mode: 511
  tor-listeners:
    require-sasl: false
    vhost: tor-network.onion
    max-connections: 64
    throttle-duration: 10m
    max-connections-per-duration: 64
  sts:
    enabled: false
    duration: 1mo2d5m
    port: 6697
    preload: false
  websockets:
    allowed-origins: null
  casemapping: precis
  enforce-utf8: true
  lookup-hostnames: false
  forward-confirm-hostnames: true
  check-ident: false
  coerce-ident: ~u
  motd: ergo.motd
  motd-formatting: true
  relaymsg:
    enabled: true
    separators: /
    available-to-chanops: true
  proxy-allowed-from:
  - localhost
  allow-plaintext-resume: false
  max-sendq: 96k
  compatibility:
    force-trailing: true
    send-unprefixed-sasl: true
    allow-truncation: false
  ip-limits:
    count: false
    max-concurrent-connections: 16
    throttle: false
    window: 10m
    max-connections-per-window: 32
    cidr-len-ipv4: 32
    cidr-len-ipv6: 64
    exempted:
    - localhost
    custom-limits: null
  ip-check-script:
    enabled: false
    command: /usr/local/bin/check-ip-ban
    args: []
    timeout: 9s
    kill-timeout: 1s
    max-concurrency: 64
  ip-cloaking:
    enabled: true
    enabled-for-always-on: true
    netname: irc
    cidr-len-ipv4: 32
    cidr-len-ipv6: 64
    num-bits: 64
  secure-nets: null
accounts:
  authentication-enabled: true
  registration:
    enabled: true
    allow-before-connect: true
    throttling:
      enabled: true
      duration: 10m
      max-attempts: 30
    bcrypt-cost: 4
    verify-timeout: 32h
    email-verification:
      enabled: false
      sender: admin@my.network
      require-tls: true
      helo-domain: my.network
      blacklist-regexes: null
  login-throttling:
    enabled: true
    duration: 1m
    max-attempts: 3
  skip-server-password: false
  login-via-pass-command: true
  require-sasl:
    enabled: false
    exempted:
    - localhost
  nick-reservation:
    enabled: true
    additional-nick-limit: 0
    method: strict
    allow-custom-enforcement: false
    guest-nickname-format: Guest-*
    force-guest-format: false
    force-nick-equals-account: true
    forbid-anonymous-nick-changes: false
  multiclient:
    enabled: true
    allowed-by-default: true
    always-on: opt-in
    auto-away: opt-in
  vhosts:
    enabled: true
    max-length: 64
    valid-regexp: ^[0-9A-Za-z.\-_/]+$
  default-user-modes: +i
  auth-script:
    enabled: false
    command: /usr/local/bin/authenticate-irc-user
    args: []
    autocreate: true
    timeout: 9s
    kill-timeout: 1s
    max-concurrency: 64
channels:
  default-modes: +nt
  max-channels-per-client: 100
  operator-only-creation: false
  registration:
    enabled: true
    operator-only: false
    max-channels-per-account: 15
  list-delay: 0s
  invite-expiration: 24h
oper-classes:
  chat-moderator:
    title: Chat Moderator
    capabilities:
    - kill
    - ban
    - nofakelag
    - roleplay
    - relaymsg
    - vhosts
    - sajoin
    - samode
    - snomasks
  server-admin:
    title: Server Admin
    extends: chat-moderator
    capabilities:
    - rehash
    - accreg
    - chanreg
    - history
    - defcon
    - massmessage
logging:
- method: stderr
  type: '* -userinput -useroutput'
  level: info
debug:
  recover-from-errors: true
datastore:
  path: ircd.db
  autoupgrade: true
languages:
  enabled: true
  default: en
  path: /ircd-bin/languages
limits:
  nicklen: 32
  identlen: 20
  channellen: 64
  awaylen: 390
  kicklen: 390
  topiclen: 390
  monitor-entries: 100
  whowas-entries: 100
  chan-list-modes: 60
  registration-messages: 1024
  multiline:
    max-bytes: 4096
    max-lines: 100
fakelag:
  enabled: true
  window: 1s
  burst-limit: 5
  messages-per-window: 2
  cooldown: 2s
roleplay:
  enabled: false
  require-oper: false
  require-chanops: false
  add-suffix: true
extjwt: null
history:
  enabled: false
  channel-length: 2048
  client-length: 256
  autoresize-window: 3d
  autoreplay-on-join: 0
  chathistory-maxmessages: 100
  znc-maxmessages: 2048
  restrictions:
    expire-time: 1w
    query-cutoff: none
    grace-period: 1h
  persistent:
    enabled: false
    unregistered-channels: false
    registered-channels: opt-out
    direct-messages: opt-out
  retention:
    allow-individual-delete: false
    enable-account-indexing: false
  tagmsg-storage:
    default: false
    whitelist:
    - +draft/react
    - react
allow-environment-overrides: true
