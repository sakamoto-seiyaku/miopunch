# miopunch Alpha/POC 示例配置（可直接改）
#
# 目的：
# - 展示 miopunch（Alpha/POC）配置项的命名与风格（TOML + snake_case）
# - 把“代码内置默认的 STUN cn/global 名单”显式展开到配置文件里，便于用户按需修改
#
# 约定：
# - 你可以只复制你关心的字段；未配置字段仍以程序内置默认值为准
# - STUN 名单同步来源：`connectivity/stun_internal.go`

[defaults]
default_session = "main"
# default_target = "wsl:ubuntu"

[targets]
# 目标连接器（被控端）。
# POC：Windows 原生 powershell/cmd 不作为 target；shell 目标主要来自 WSL/ssh。
#
# WSL：配置是可选的（用于“更短别名/更友好展示”）；你仍可直接在 CLI 里写 `wsl:<distro>`。
[targets.wsl.ubuntu]
distro = "Ubuntu-22.04" # 来自 `wsl.exe -l -q`

# VM/其它：ssh target 必须显式配置（在 CLI 中使用 `ssh:<name>`）。
[targets.ssh.home]
host = "192.168.1.50"
port = 22
user = "ubuntu"
# auth 细节（key/agent）按实现最佳实践收敛；POC 至少支持 key/agent。

[resolver]
# 仅用于 STUN/MQTT 的域名解析；不扩展为全局网络栈语义。
mode = "auto"     # auto | system | builtin
protocol = "tcp"  # POC 固定：tcp53（不做 DoT/DoH）
servers = [
  "1.1.1.1:53",
  "8.8.8.8:53",
  "223.5.5.5:53",
  "119.29.29.29:53",
]

[control_plane]
broker_profile = "global" # global | cn（未显式配置 brokers 时生效）
# brokers = ["broker.example.com:1883"] # 显式覆盖内置 broker 列表（host:port；可为域名或 IP；默认语义为 tcp）
#
# 约定（POC）：
# - brokers 的顺序即优先级；常驻 up 只会同时连接前 2 个（不足则 1 个）
# - 生成 invite code 时会把“最终生效 brokers”的前 1–2 个写入 code（joiner 无需额外配置即可入网）
# - 为避免 joiner/approver 因 DNS 差异落到不同 broker 实例，invite 会尽量把 hostname 规范化/固定为 `ip:port` 再写入 code
#   - 若无法解析则保留 hostname 并在 invite/approve/join 强警告（该 code 的成功将依赖双方 DNS 结果一致）
#
# POC 内置默认 brokers（公共测试 broker；示例/不保证长期可用；可能限流/变更/不可达）：
# - 仅使用 TCP `:1883`（POC 不强推 MQTT over TLS/WSS；需要时自行显式配置）
#
# - global（默认）优先级：
#   1) mqtt.eclipseprojects.io:1883
#   2) broker.emqx.io:1883
#   3) broker.hivemq.com:1883
#
# - cn 优先级（仅调整顺序；同一集合）：
#   1) broker.emqx.io:1883
#   2) mqtt.eclipseprojects.io:1883
#   3) broker.hivemq.com:1883
#
# 显式覆盖示例：
# brokers = ["mqtt.eclipseprojects.io:1883", "broker.emqx.io:1883"]

# 内置 STUN 分桶（cn/global）：用于 view 采样与仲裁。
# 说明：bucket 只作用于“STUN 观测到的公网映射视图”，不影响 LAN/local candidates 的收集与交换。

