quic_cc = "bbr"     # bbr | brutal（仅 quic 生效）
# brutal_up_bps = 2000000
# brutal_down_bps = 2000000

[http_panel]
enabled = false
listen_addr = "127.0.0.1:27400"
reports_keep = 20
